name: Validate telemetry records

on:
  pull_request:
    paths:
      - "data/raw/**"
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate JSONL records against schema v2.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Find changed paths under data/raw/**
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'data/raw/**' || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # Step: Path-scope enforcement (structural)
      #
      # NOTE (v0.4+): household_id is an opaque UUID intentionally unrelated
      # to the GitHub login (see docs/PRIVACY.md), so we no longer bind the
      # path to the pusher's username. This check just enforces that records
      # land in a non-empty subdirectory under data/raw/<id>/..., which
      # catches accidental writes to the repo root or to data/raw/ itself.
      # ------------------------------------------------------------------
      - name: Enforce path scope (records must live under data/raw/<id>/...)
        id: path_scope
        run: |
          python3 - <<'PYEOF'
          import os, sys

          changed_raw = os.environ.get("CHANGED_FILES", "").strip()
          if not changed_raw:
              print("No changed files under data/raw/**. Nothing to check.")
              sys.exit(0)

          changed_files = [p.strip() for p in changed_raw.splitlines() if p.strip()]
          violations = []

          for path in changed_files:
              if not path.startswith("data/raw/"):
                  continue
              if path in ("data/raw/.gitkeep",):
                  continue
              # Must be data/raw/<non-empty-id>/<something>
              parts = path.split("/")
              if len(parts) < 4 or not parts[2]:
                  violations.append(path)
                  continue

          if violations:
              print("PATH SCOPE VIOLATION: the following paths are not under data/raw/<id>/...:")
              for v in violations:
                  print(f"  {v}")
              print("\nRecords must live under data/raw/<household_id>/<year>/<month>/<day>.jsonl")
              sys.exit(1)
          else:
              print(f"Path scope OK: all {len(changed_files)} changed path(s) are correctly nested under data/raw/<id>/")
          PYEOF
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}

      - name: Post path-scope violation comment to PR
        if: failure() && steps.path_scope.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `:red_circle: **Path scope violation**: telemetry records must be written under \`data/raw/<household_id>/<year>/<month>/<day>.jsonl\`. Your PR contains paths outside that structure.`
            });

      # ------------------------------------------------------------------
      # Step: Date range enforcement
      # ------------------------------------------------------------------
      - name: Enforce record date range (max 7 days backdating, no future records)
        id: date_check
        run: |
          python3 - <<'PYEOF'
          import json, sys, os
          from pathlib import Path
          from datetime import UTC, datetime, timedelta

          changed_raw = os.environ.get("CHANGED_FILES", "").strip()
          if not changed_raw:
              print("No changed files. Skipping date check.")
              sys.exit(0)

          changed_files = [p.strip() for p in changed_raw.splitlines() if p.strip()]
          jsonl_files = [p for p in changed_files if p.endswith(".jsonl")]

          now_utc = datetime.now(tz=UTC)
          cutoff_past = now_utc - timedelta(days=7)
          errors_found = 0

          for filepath in jsonl_files:
              path = Path(filepath)
              if not path.exists():
                  continue
              with path.open() as f:
                  for line_num, line in enumerate(f, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          record = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      ts_raw = record.get("interval_start_utc", "")
                      if not ts_raw:
                          continue
                      try:
                          ts = datetime.fromisoformat(ts_raw.replace("Z", "+00:00"))
                      except ValueError:
                          print(f"ERROR {filepath}:{line_num}: Cannot parse interval_start_utc: {ts_raw!r}")
                          errors_found += 1
                          continue
                      if ts < cutoff_past:
                          print(
                              f"ERROR {filepath}:{line_num}: interval_start_utc {ts_raw!r} is "
                              f"more than 7 days in the past (cutoff: {cutoff_past.isoformat()})"
                          )
                          errors_found += 1
                      elif ts > now_utc + timedelta(minutes=10):
                          print(
                              f"ERROR {filepath}:{line_num}: interval_start_utc {ts_raw!r} is "
                              f"in the future (now: {now_utc.isoformat()})"
                          )
                          errors_found += 1

          if errors_found:
              print(f"\nDATE CHECK FAILED: {errors_found} record(s) outside allowed range.")
              sys.exit(1)
          else:
              print(f"Date check passed for {len(jsonl_files)} JSONL file(s).")
          PYEOF
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}

      # ------------------------------------------------------------------
      # Step: Schema v2.0 validation
      # Checks:
      #   - schema_version field == '2.0' (v1.x records are rejected)
      #   - JSON Schema validates (additionalProperties: false at top level)
      #   - All price fields are in $/kWh range (-2.0 to 20.0)
      # ------------------------------------------------------------------
      - name: Validate changed JSONL files against schema v2.0
        id: validate
        run: |
          python3 - <<'PYEOF'
          import json, sys, os
          from pathlib import Path

          try:
              import jsonschema
          except ImportError:
              print("jsonschema not available, skipping validation")
              sys.exit(0)

          schema_path = Path("schema/telemetry.schema.json")
          if not schema_path.exists():
              print("Schema file not found, skipping validation")
              sys.exit(0)

          with schema_path.open() as f:
              schema = json.load(f)

          validator = jsonschema.Draft202012Validator(schema)

          # Price fields that must be in $/kWh range (-2.0 to 20.0)
          PRICE_FIELDS = [
              "price_signal_seen",
              "price_export_seen",
              "shadow_energy_price",
              "shadow_load_forecast_price",
              "shadow_solar_forecast_price",
              "shadow_envelope_import_price",
              "shadow_envelope_export_price",
          ]
          PRICE_MIN = -2.0
          PRICE_MAX = 20.0

          changed_raw = os.environ.get("CHANGED_FILES", "")
          changed_files = [p.strip() for p in changed_raw.splitlines() if p.strip()]

          if not changed_files:
              changed_files = list(str(p) for p in Path("data/raw").rglob("*.jsonl"))

          errors_found = 0
          records_validated = 0

          for filepath in changed_files:
              path = Path(filepath)
              if not path.exists() or path.suffix != ".jsonl":
                  continue
              with path.open() as f:
                  for line_num, line in enumerate(f, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          record = json.loads(line)
                      except json.JSONDecodeError as exc:
                          print(f"ERROR {filepath}:{line_num}: JSON parse error: {exc}")
                          errors_found += 1
                          continue

                      # Reject v1.x records (clean break)
                      sv = record.get("schema_version")
                      if sv != "2.0":
                          print(
                              f"ERROR {filepath}:{line_num}: schema_version={sv!r} is not '2.0'. "
                              f"v1.x records are not accepted in this repository."
                          )
                          errors_found += 1
                          continue

                      # JSON Schema validation
                      errs = list(validator.iter_errors(record))
                      if errs:
                          for err in errs:
                              path_str = ".".join(str(p) for p in err.path) or "root"
                              print(f"ERROR {filepath}:{line_num}: {path_str}: {err.message}")
                          errors_found += len(errs)
                          records_validated += 1
                          continue

                      # Explicit $/kWh range check on price fields
                      for field in PRICE_FIELDS:
                          val = record.get(field)
                          if val is None:
                              continue
                          try:
                              fval = float(val)
                          except (TypeError, ValueError):
                              continue
                          if not (PRICE_MIN <= fval <= PRICE_MAX):
                              print(
                                  f"ERROR {filepath}:{line_num}: {field}={fval} is outside "
                                  f"allowed $/kWh range [{PRICE_MIN}, {PRICE_MAX}]. "
                                  f"Prices must be in $/kWh (not $/MWh)."
                              )
                              errors_found += 1

                      records_validated += 1

          print(f"Validated {records_validated} records across {len(changed_files)} file(s).")
          if errors_found:
              print(f"FAILED: {errors_found} validation error(s) found.")
              sys.exit(1)
          else:
              print("All records valid.")
          PYEOF
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.changed_files }}

      - name: Post validation summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const pathOutcome   = '${{ steps.path_scope.outcome }}';
            const dateOutcome   = '${{ steps.date_check.outcome }}';
            const schemaOutcome = '${{ steps.validate.outcome }}';

            const allPassed = [pathOutcome, dateOutcome, schemaOutcome].every(o => o === 'success');
            const status = allPassed ? 'passed' : 'FAILED';
            const emoji  = allPassed ? 'green_circle' : 'red_circle';

            const lines = [
              `:${emoji}: Telemetry validation **${status}**`,
              '',
              `| Check | Result |`,
              `|---|---|`,
              `| Path scope | ${pathOutcome === 'success' ? 'PASS' : 'FAIL'} |`,
              `| Date range (max 7 days backdating) | ${dateOutcome === 'success' ? 'PASS' : 'FAIL'} |`,
              `| Schema v2.0 ($/kWh range, schema_version check) | ${schemaOutcome === 'success' ? 'PASS' : 'FAIL'} |`,
              '',
              `See the [validate job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            ];

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });
