name: Aggregate telemetry

on:
  # Run every hour. Schedule is now the sole automatic trigger so we
  # avoid the schedule vs. push race that was causing Pages deploys to
  # collide and fail with "Deployment failed, try again later."
  schedule:
    - cron: "5 * * * *"
  # Allow manual trigger for on-demand refreshes.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment. cancel-in-progress: true
# means a newer run supersedes an in-flight one instead of queueing,
# which eliminates the collision race between overlapping deploys.
# Aggregation is idempotent so losing an in-flight run costs nothing.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  aggregate:
    name: Aggregate and publish cohort data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required by actions/deploy-pages@v5 for the inline Pages deploy below.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute raw-data fingerprint
        # Hash every file under data/raw/**. If the hash matches the value
        # cached from the previous successful run, no new telemetry has
        # arrived since the last aggregate, so we can skip the expensive
        # aggregate + Pages deploy path entirely.
        id: fingerprint
        run: |
          if find data/raw -type f \( -name '*.jsonl' -o -name '*.json' \) 2>/dev/null | sort | xargs -r sha256sum > /tmp/raw_manifest.txt; then
            HASH=$(sha256sum /tmp/raw_manifest.txt | awk '{print $1}')
          else
            HASH="empty"
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Raw-data fingerprint: $HASH"

      - name: Restore raw-data fingerprint cache
        id: fingerprint_cache
        uses: actions/cache@v6
        with:
          path: .fingerprint
          key: raw-fingerprint-${{ steps.fingerprint.outputs.hash }}

      - name: Short-circuit if raw data unchanged
        id: gate
        run: |
          if [ "${{ steps.fingerprint_cache.outputs.cache-hit }}" = "true" ]; then
            echo "Raw data unchanged since last successful run — skipping aggregate + deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Raw data changed (or no prior fingerprint) — running full pipeline."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-aggregate-${{ hashFiles('scripts/requirements-aggregate.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-aggregate-

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install pandas pyarrow jsonschema

      - name: Ensure site/data and data/cohort directories exist
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p site/data
          mkdir -p data/cohort/5min
          mkdir -p data/cohort/hourly
          mkdir -p data/cohort/daily

      - name: Run aggregation script
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/aggregate.py

      - name: Commit cohort outputs and site data
        if: steps.gate.outputs.skip != 'true'
        # Use [skip ci] to prevent re-triggering this workflow on its own
        # commit. The Pages deploy steps below run inline in this workflow,
        # so we no longer rely on a separate pages.yml that would have been
        # blocked by [skip ci] anyway.
        # Pull --rebase before push to recover from concurrent commits (e.g.
        # a telemetry push or a manual maintenance push that landed while
        # the aggregate job was running).
        run: |
          git config user.name "nem-flex-bot"
          git config user.email "nem-flex-bot@users.noreply.github.com"
          git add data/cohort/ site/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update cohort aggregates and site data [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push; then
                echo "Pushed on attempt $i"
                exit 0
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 3
            done
            echo "All push attempts failed." >&2
            exit 1
          fi

      - name: Persist fingerprint for next run
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p .fingerprint
          echo "${{ steps.fingerprint.outputs.hash }}" > .fingerprint/raw.sha256

      # ----------------------------------------------------------------
      # Deploy the dashboard to GitHub Pages.
      #
      # Rolling the Pages deploy into this workflow (rather than relying
      # on a separate pages.yml triggered by site/** changes) sidesteps a
      # chicken-and-egg problem: the aggregate workflow commits its own
      # site/data updates with [skip ci] to avoid recursive triggering,
      # which also blocks every other workflow including the Pages
      # deploy. Doing the deploy inline keeps it firing on every fresh
      # aggregate without re-introducing recursion risk.
      # ----------------------------------------------------------------
      - name: Configure GitHub Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v5
